# Install at /etc/nginx/snippets/whs4-dashboard-locations.conf.
# Same-origin browser requests keep the supplied Bearer token.
location ^~ /dashboard-api/api/dashboard/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8000/api/dashboard/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 7s;
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}
location = /dashboard-api { return 404; }
location /dashboard-api/ { return 404; }
location = /api/detection {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
location = /api/heartbeat {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
location = /health {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 7s;
    proxy_intercept_errors off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}
# Keep unknown API routes out of the React fallback.
location /api/ { return 404; }
location = /docs { return 404; }
location = /redoc { return 404; }
location = /openapi.json { return 404; }
location ~ /\. { return 404; }
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}
